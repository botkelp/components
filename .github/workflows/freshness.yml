name: Component freshness audit

on:
  schedule:
    # Weekly, Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "components/**/manifest.json"
      - "scripts/check_freshness.py"
      - ".github/workflows/freshness.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Freshness audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install packaging

      - name: Run freshness checker
        run: python scripts/check_freshness.py
        continue-on-error: true  # report even if exit non-zero for visibility

      - name: Upload reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: freshness-reports
          path: |
            reports/freshness.json
            reports/SUMMARY.md
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## Freshness audit" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/SUMMARY.md ]; then
            cat reports/SUMMARY.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No report generated" >> $GITHUB_STEP_SUMMARY
          fi
